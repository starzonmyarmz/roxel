name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle
      - name: Build arm64 .app and rox
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          cargo bundle --release --target aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin -p roxel-cli
          tar -cf macos-arm64.tar -C target/aarch64-apple-darwin/release/bundle/osx Roxel.app
          tar -rf macos-arm64.tar -C target/aarch64-apple-darwin/release rox
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          if-no-files-found: error
          path: macos-arm64.tar

  macos-x86_64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-x86_64
      - name: Build x86_64 binaries
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin -p roxel-cli
          tar -cf macos-x86_64.tar -C target/x86_64-apple-darwin/release Roxel rox
      - uses: actions/upload-artifact@v7
        with:
          name: macos-x86_64
          if-no-files-found: error
          path: macos-x86_64.tar

  macos-universal:
    needs: [macos-arm64, macos-x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          merge-multiple: true
      - name: Merge into a universal .app
        run: |
          set -euo pipefail
          tar -xf macos-arm64.tar
          mkdir x86_64
          tar -xf macos-x86_64.tar -C x86_64
          app=Roxel.app
          lipo -create \
            "$app/Contents/MacOS/Roxel" \
            x86_64/Roxel \
            -output Roxel-universal
          mv Roxel-universal "$app/Contents/MacOS/Roxel"
          lipo "$app/Contents/MacOS/Roxel" -verify_arch arm64
          lipo "$app/Contents/MacOS/Roxel" -verify_arch x86_64
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" Roxel-macos.zip

          lipo -create rox x86_64/rox -output rox-universal
          mv rox-universal rox
          lipo rox -verify_arch arm64
          lipo rox -verify_arch x86_64
          codesign --force --sign - rox
          zip -j rox-macos.zip rox
      - uses: actions/upload-artifact@v7
        with:
          name: build-macOS
          if-no-files-found: error
          path: |
            Roxel-macos.zip
            rox-macos.zip

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build Windows .exe and installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cargo build --release --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path target/release/Roxel.exe -DestinationPath Roxel-windows.zip
          Compress-Archive -Path target/release/rox.exe -DestinationPath rox-windows.zip
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = $env:TAG_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/O$PWD" packaging\windows\roxel.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Build Linux tarball
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo build --release --workspace
          tar -czf rox-linux.tar.gz -C target/release rox
          mkdir Roxel
          cp target/release/Roxel Roxel/
          cp assets/icons/roxel.iconset/icon_256x256.png Roxel/roxel.png
          cp packaging/linux/install.sh packaging/linux/roxel.desktop packaging/linux/roxel.xml Roxel/
          tar -czf Roxel-linux.tar.gz Roxel

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ runner.os }}
          if-no-files-found: error
          path: |
            Roxel-*.zip
            Roxel-*.tar.gz
            Roxel-setup.exe
            rox-*.zip
            rox-*.tar.gz

  release:
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches Cargo.toml and write the notes
        run: |
          set -euo pipefail
          source scripts/version.sh
          version="${GITHUB_REF_NAME#v}"
          [[ "$(read_version)" == "$version" ]] || {
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $(read_version)"
            exit 1
          }
          scripts/changelog-notes "$version" > release-notes.md
          [[ -s release-notes.md ]] || {
            echo "::error::CHANGELOG.md has no [$version] section"
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          [[ "$version" == *-* ]] && prerelease=true || prerelease=false
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum Roxel-* rox-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          name: Roxel ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          files: |
            dist/Roxel-*
            dist/rox-*
            dist/SHA256SUMS
          body_path: release-notes.md

  publish-itch:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Install butler
        env:
          BUTLER_VERSION: 15.32.0
        run: |
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          unzip -q butler.zip
          chmod +x butler
          ./butler -V
      - name: Push each build to its itch.io channel
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -uo pipefail
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          builds=(dist/Roxel-*.zip dist/Roxel-*.tar.gz)
          if (( ${#builds[@]} == 0 )); then
            echo "::error::no Roxel-*.zip or Roxel-*.tar.gz builds to push"
            exit 1
          fi
          failed=0
          for build in "${builds[@]}"; do
            name="$(basename "$build")"
            name="${name%.zip}"
            name="${name%.tar.gz}"
            channel="${name#Roxel-}"
            echo "::group::${channel}"
            target="$build"
            if [[ "$build" == *.tar.gz ]]; then
              target="dist/${name}"
              mkdir -p "$target"
              tar -xzf "$build" -C "$target" || { failed=1; echo "::endgroup::"; continue; }
            fi
            ./butler push "$target" "starzonmyarmz/roxel:${channel}" --userversion "$version" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
