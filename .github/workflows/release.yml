name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle
      - name: Build arm64 .app
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          cargo bundle --release --target aarch64-apple-darwin
          tar -cf macos-arm64.tar -C target/aarch64-apple-darwin/release/bundle/osx Roxel.app
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          if-no-files-found: error
          path: macos-arm64.tar

  macos-x86_64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-x86_64
      - name: Build x86_64 binary
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          tar -cf macos-x86_64.tar -C target/x86_64-apple-darwin/release Roxel
      - uses: actions/upload-artifact@v7
        with:
          name: macos-x86_64
          if-no-files-found: error
          path: macos-x86_64.tar

  macos-universal:
    needs: [macos-arm64, macos-x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          merge-multiple: true
      - name: Merge into a universal .app
        run: |
          set -euo pipefail
          tar -xf macos-arm64.tar
          mkdir x86_64
          tar -xf macos-x86_64.tar -C x86_64
          app=Roxel.app
          lipo -create \
            "$app/Contents/MacOS/Roxel" \
            x86_64/Roxel \
            -output Roxel-universal
          mv Roxel-universal "$app/Contents/MacOS/Roxel"
          lipo "$app/Contents/MacOS/Roxel" -verify_arch arm64
          lipo "$app/Contents/MacOS/Roxel" -verify_arch x86_64
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" Roxel-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: build-macOS
          if-no-files-found: error
          path: Roxel-macos.zip

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build Windows .exe and installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cargo build --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path target/release/Roxel.exe -DestinationPath Roxel-windows.zip
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = $env:TAG_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/O$PWD" packaging\windows\roxel.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Build Linux tarball
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo build --release
          mkdir Roxel
          cp target/release/Roxel Roxel/
          cp assets/icons/roxel.iconset/icon_256x256.png Roxel/roxel.png
          cp packaging/linux/install.sh packaging/linux/roxel.desktop packaging/linux/roxel.xml Roxel/
          tar -czf Roxel-linux.tar.gz Roxel

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ runner.os }}
          if-no-files-found: error
          path: |
            Roxel-*.zip
            Roxel-*.tar.gz
            Roxel-setup.exe

  changelog:
    runs-on: ubuntu-latest
    outputs:
      notes_path: release-notes.md
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalize CHANGELOG.md
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG_NAME#v}"
          DATE="$(date -u +%Y-%m-%d)"
          PREV_TAG="$(git tag --sort=-version:refname | grep -v "^${TAG_NAME}\$" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..${TAG_NAME}"; else RANGE="$TAG_NAME"; fi
          git log --pretty=format:'- %s' "$RANGE" > /tmp/bullets.txt
          VERSION="$VERSION" DATE="$DATE" python3 <<'PY'
          import os, pathlib
          version = os.environ["VERSION"]
          date = os.environ["DATE"]
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()
          lines = text.splitlines(keepends=True)
          out, i, header = [], 0, f"## [{version}] - {date}\n"
          bullets = None
          while i < len(lines):
              line = lines[i]
              if bullets is None and line.startswith("## [Unreleased]"):
                  i += 1
                  body = []
                  while i < len(lines) and not lines[i].startswith("## "):
                      body.append(lines[i])
                      i += 1
                  bullets = "".join(body).strip()
                  if not bullets:
                      bullets = pathlib.Path("/tmp/bullets.txt").read_text().strip()
                  bullets += "\n"
                  out += [line, "\n", header, "\n", bullets]
                  if i < len(lines):
                      out.append("\n")
                  continue
              out.append(line)
              i += 1
          if bullets is None:
              raise SystemExit("CHANGELOG.md has no '## [Unreleased]' section")
          path.write_text("".join(out))
          pathlib.Path("release-notes.md").write_text(header + "\n" + bullets)
          PY
      - name: Commit + push to main
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: finalize CHANGELOG for ${TAG_NAME} [skip ci]"
            git push origin main
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  release:
    needs: [build, macos-universal, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum Roxel-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Roxel-*
            dist/SHA256SUMS
          body_path: dist/release-notes.md

  publish-itch:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Install butler
        env:
          BUTLER_VERSION: 15.32.0
        run: |
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          unzip -q butler.zip
          chmod +x butler
          ./butler -V
      - name: Push each build to its itch.io channel
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -uo pipefail
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          builds=(dist/Roxel-*.zip dist/Roxel-*.tar.gz)
          if (( ${#builds[@]} == 0 )); then
            echo "::error::no Roxel-*.zip or Roxel-*.tar.gz builds to push"
            exit 1
          fi
          failed=0
          for build in "${builds[@]}"; do
            name="$(basename "$build")"
            name="${name%.zip}"
            name="${name%.tar.gz}"
            channel="${name#Roxel-}"
            echo "::group::${channel}"
            target="$build"
            if [[ "$build" == *.tar.gz ]]; then
              target="dist/${name}"
              mkdir -p "$target"
              tar -xzf "$build" -C "$target" || { failed=1; echo "::endgroup::"; continue; }
            fi
            ./butler push "$target" "starzonmyarmz/roxel:${channel}" --userversion "$version" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
