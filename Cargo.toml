[package]
name = "roxel"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18"
bevy_egui = "0.39"
bevy_panorbit_camera = { version = "0.34", features = ["bevy_egui"] }
dot_vox = "5"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
anyhow = "1"
rfd = "0.17"
egui_extras = { version = "0.33.3", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Faster dev iteration: optimize deps, leave own crate at -O1.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
