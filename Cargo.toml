[package]
name = "roxel"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "Roxel"
path = "src/main.rs"

[dependencies]
bevy = "0.18"
bevy_egui = "0.39"
bevy_panorbit_camera = { version = "0.34", features = ["bevy_egui"] }
dot_vox = "5"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
anyhow = "1"
rfd = "0.17"
egui_extras = { version = "0.33.3", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
winit = "0.30"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSThread"] }
muda = "0.19"

# Faster dev iteration: optimize deps, leave own crate at -O1.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `cargo install cargo-bundle` then `cargo bundle --release` to produce Roxel.app.
[package.metadata.bundle]
name = "Roxel"
identifier = "com.danielmarino.roxel"
icon = ["assets/icons/roxel.icns"]
category = "public.app-category.graphics-design"
short_description = "Voxel editor"
