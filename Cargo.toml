[workspace]
members = ["roxel-core", "roxel-cli"]

[package]
name = "roxel"
version = "1.3.2"
edition = "2024"

[[bin]]
name = "Roxel"
path = "src/main.rs"

[dependencies]
roxel-core = { path = "roxel-core" }
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_pbr",
    "bevy_gizmos_render",
    "png",
    "tonemapping_luts",
] }
bevy_egui = { version = "0.43", default-features = false, features = [
    "manage_clipboard",
    "open_url",
    "default_fonts",
    "render",
] }
bevy_panorbit_camera = { version = "0.36", features = ["bevy_egui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
anyhow = "1"
rfd = "0.18"
egui_extras = { version = "0.36", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
winit = "0.30"
dirs = "7"
ureq = { version = "3", default-features = false, features = ["rustls"] }
open = "5"

[features]
# Link Bevy as a shared library to slash link times.
# Use: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSThread",
    "NSString",
    "NSNotification",
    "NSAppleEventManager",
    "NSAppleEventDescriptor",
    "NSURL",
    "objc2-core-services",
] }
muda = "0.19"

# Faster dev iteration: own crate at -O1, everything else at 0.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# `cargo install cargo-bundle` then `cargo bundle --release` to produce Roxel.app.
[package.metadata.bundle]
name = "Roxel"
identifier = "com.danielmarino.roxel"
icon = ["assets/icons/roxel.icns"]
category = "public.app-category.graphics-design"
short_description = "Voxel editor"

[package.metadata.bundle.osx]
# Merged into the generated Info.plist so macOS associates `.rox` with Roxel
# (CFBundleDocumentTypes + UTI). The matching launch handler is src/open_file.rs.
info_plist_exts = ["assets/Info.plist.ext"]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
