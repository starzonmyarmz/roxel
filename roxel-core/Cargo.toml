[package]
name = "roxel-core"
version.workspace = true
edition = "2024"

[lib]
name = "roxel"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
bevy_ecs = "0.20"
dot_vox = "5"
glam = "0.33"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
dirs = "7"
zstd = "0.13"
rquickjs = { version = "0.14", optional = true, features = ["allocator"] }

[features]
default = ["scripting"]
scripting = ["dep:rquickjs"]
